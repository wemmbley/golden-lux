<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="/Source/Quas.js"></script>
    <link rel="stylesheet" href="/Demo/Styles/Main.css">
<body class="min-h-screen flex flex-col max-lg:pb-16">
    <template id="app" attrs="{ class: 'flex flex-col flex-1' }">
        <Menu :menu="menu" :mobileMenu="mobileMenu" w-transition></Menu>
        <div class="w-full max-w-[770px] mx-auto pt-5">
            <Article :article="posts[0]" w-transition></Article>
        </div>
        <Footer class="block mt-auto" w-transition></Footer>
    </template>
</body>
<footer>
    <script src="https://unpkg.com/jquery/dist/jquery.min.js"></script>
    <script src="/Source/Wex.js"></script>
    <script>
        $('#app')
            .state({
                menu: {},
                mobileMenu: {},
                posts: {},
            })
            .on('$mount', (state) => {
                $wire.get('/Demo/Structures/Menu.json').to(state.menu);
                $wire.get('/Demo/Structures/MobileMenu.json').to(state.mobileMenu);
                $wire.get('/Demo/Structures/Posts.json').to(state.posts);
            })
            .component('Menu', '/Demo/Layouts/Menu.html')
            .component('Footer', '/Demo/Layouts/Footer.html')
            .component('Article', '/Demo/Components/Article.html')
            .mount();
    </script>
</footer>
</html>

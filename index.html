<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Golden Lux</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cbcdn.githack.com/wemmbley/quas/raw/branch/master/Compiled/Quas.min.js"></script>
    <link rel="stylesheet" href="Styles/Main.css">
</head>
<body class="min-h-screen flex flex-col max-lg:pb-16">
    <template id="app" attrs="{ class: 'flex flex-col flex-1' }">
        <Menu :menu="menu" :mobileMenu="mobileMenu" w-transition></Menu>

        <!-- главная: #/ -->
        <div w-route="'/'" class="w-full max-w-[1070px] mx-auto px-5">
            <Posts :posts="posts"></Posts>
        </div>

        <!-- статья: #/post?id=0 -->
        <div w-route="/^\/post(\?.*)?$/" class="w-full max-w-[770px] mx-auto pt-5">
            <Article w-if="posts[$route.params.id]"
                     :article="posts[$route.params.id]"></Article>
        </div>

        <Footer class="block mt-auto" w-transition></Footer>
    </template>
</body>
<script src="https://unpkg.com/jquery/dist/jquery.min.js"></script>
<script src="https://cbcdn.githack.com/wemmbley/wex/raw/branch/master/dist/wex.min.js"></script>
<script>
    const { createRouter } = window.jqvm

    $('#app')
        .state({
            menu: {},
            mobileMenu: {},
            posts: {},
        })
        .plugin(createRouter({ mode: 'hash' }))
        .on('$mount', (state) => {
            $wire.get('Structures/Menu.json').to(state.menu);
            $wire.get('Structures/MobileMenu.json').to(state.mobileMenu);
            $wire.get('Structures/Posts.json').to(state.posts);
        })
        .component('Menu', 'Layouts/Menu.html')
        .component('Footer', 'Layouts/Footer.html')
        .component('Posts', 'Components/Posts.html')
        .component('Article', 'Components/Article.html')
        .mount();
</script>
</html>
